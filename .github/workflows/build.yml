# Builds what users download: the Windows app and the Linux Flatpak, each
# uploaded as an artifact of the run. The build scripts are PowerShell, which
# both runners have, so there's one language to maintain for both.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    # The first build compiles miqt's Qt bindings, which takes a long time.
    # Go's build cache is kept between runs (see below), so later ones don't.
    timeout-minutes: 120
    outputs:
      version: ${{ steps.build.outputs.version }}
    # The app is built with -trimpath, and Go's build cache keys on build
    # flags, so without it here too the tests would compile miqt again.
    env:
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@v7

      # cgo can't use MSVC, so Qt and the compiler come from MSYS2's UCRT64
      # environment. windeployqt is in qt6-base, and needs qt6-tools'
      # lconvert to merge Qt's translations; ntldd finds the DLLs it misses.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-ntldd

      # Its own cache is off: it's only saved when the whole job succeeds,
      # so a failing test would throw away the compiled miqt. Go's caches are
      # kept by the steps below instead.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # So go, pkg-config and windeployqt find MSYS2's gcc and Qt from
      # PowerShell.
      - name: Put MSYS2's UCRT64 tools on the PATH
        shell: pwsh
        run: '"${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File $env:GITHUB_PATH -Append'

      # What's compiled is only any use with the same Go, gcc and Qt, which
      # MSYS2 updates now and then, so they're in the key. A change to go.sum
      # alone still starts from the last cache: Go's cache holds a package
      # by what went into it, so miqt is reused if it hasn't changed.
      - name: Find Go's caches
        id: go-cache
        shell: pwsh
        run: |
          $prefix = "go-windows-$(go env GOVERSION)-gcc$(gcc -dumpfullversion)-qt$(pkg-config --modversion Qt6Core)-"
          "build=$(go env GOCACHE)", "modules=$(go env GOMODCACHE)", "prefix=$prefix", "key=$prefix${{ hashFiles('go.sum') }}" |
              Out-File $env:GITHUB_OUTPUT -Append

      - uses: actions/cache/restore@v6
        id: restore-go-cache
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
          key: ${{ steps.go-cache.outputs.key }}
          restore-keys: ${{ steps.go-cache.outputs.prefix }}

      - name: Build the app
        id: build
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Msys2Root '${{ steps.msys2.outputs.msys2-location }}'

      # Straight after the build, which has compiled miqt, so it's kept even
      # when the tests fail.
      - uses: actions/cache/save@v6
        if: steps.restore-go-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
          key: ${{ steps.go-cache.outputs.key }}

      # GitHub zips the folder, so it's uploaded as it is. The zip has the
      # folder's contents at its top.
      - uses: actions/upload-artifact@v7
        with:
          name: Lockdeader-${{ steps.build.outputs.version }}-windows-x64
          path: ${{ steps.build.outputs.dir }}
          if-no-files-found: error

      # After the app is up, so a failing test still leaves one to try. Qt
      # only logs to a console on Windows, and the runner has none, so
      # without QT_FORCE_STDERR_LOGGING its warnings and fatal errors would
      # go unseen. -v shows which test a crash happened in.
      #
      # The main package's tests run from their own binary, so a crash shows
      # its exit code: go test leaves it out when the tests printed anything,
      # and a crash in native code (heap corruption, abort) prints nothing
      # itself. 0xC0000374 is heap corruption, 0xC0000409 an abort or other
      # fail-fast, 0xC0000005 an access violation.
      #
      # PowerShell carries on past a failing command, and the step only
      # fails on the last one's exit code, so each is checked.
      - name: Test
        shell: pwsh
        env:
          CGO_ENABLED: '1'
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          $failed = $false

          go vet ./...
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          $main = go list .
          $mainTests = Join-Path $env:RUNNER_TEMP 'lockdeader.test.exe'
          go test -c -o $mainTests .
          if ($LASTEXITCODE -ne 0) {
              $failed = $true
          } else {
              & $mainTests -test.v
              if ($LASTEXITCODE -ne 0) {
                  Write-Host ('{0}: the tests exited with 0x{1:X8}' -f $main, $LASTEXITCODE)
                  $failed = $true
              }
          }

          go test -v (go list ./... | Where-Object { $_ -ne $main })
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          if ($failed) { exit 1 }

  windows-smoke-test:
    name: Windows app runs
    needs: windows
    # A clean runner, without MSYS2, so a DLL left out shows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: Lockdeader-${{ needs.windows.outputs.version }}-windows-x64
          path: dist/Lockdeader

      - name: Start the app
        shell: pwsh
        run: ./packaging/windows/smoke-test.ps1 -AppDir dist/Lockdeader

  flatpak:
    name: Linux Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      # Ubuntu 24.04 lets only programs with an AppArmor profile make the
      # user namespaces the build sandbox needs. Its bwrap has one, but
      # lifting the restriction costs nothing on a throwaway runner.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The compiled C++ of miqt's bindings, from the last build that
      # finished, so this one doesn't compile it again.
      - uses: actions/cache@v6
        with:
          path: .flatpak-builder/ccache
          key: flatpak-ccache-${{ hashFiles('go.sum', 'packaging/flatpak/*.yml') }}-${{ github.sha }}
          restore-keys: |
            flatpak-ccache-${{ hashFiles('go.sum', 'packaging/flatpak/*.yml') }}-
            flatpak-ccache-

      - name: Build the Flatpak
        id: build
        shell: pwsh
        run: ./packaging/flatpak/build.ps1

      # One file, so it's uploaded as it is rather than zipped; the
      # artifact takes the file's name.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.bundle }}
          archive: false
          if-no-files-found: error
